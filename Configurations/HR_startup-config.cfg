
!
version 15.1
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname HR
!
boot-start-marker
boot-end-marker
!
!
logging discriminator EXCESS severity drops 6 msg-body drops EXCESSCOLL 
logging buffered 50000
logging console discriminator EXCESS
enable secret 4 N9RE7s2VIi5QNTsVRUh7QArgDZFPqti8iJz80SrDDUA
!
username isaac secret 4 N9RE7s2VIi5QNTsVRUh7QArgDZFPqti8iJz80SrDDUA
no aaa new-model
no ip routing
no ip icmp rate-limit unreachable
!
no ip cef
!
!
ip dhcp snooping vlan 10,20,30,40
no ip dhcp snooping information option
ip dhcp snooping
no ip domain-lookup
ip domain-name gns3project.com
no ipv6 cef
ipv6 multicast rpf use-bgp
!
!
!
!
!
!
!
errdisable recovery cause psecure-violation
spanning-tree mode pvst
spanning-tree portfast bpdufilter default
spanning-tree extend system-id
!
!
!
!
vlan internal allocation policy ascending
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description TO_D1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,99
 switchport mode trunk
 duplex auto
 ip dhcp snooping trust
!
interface Ethernet0/1
 description TO_D2
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,99
 switchport mode trunk
 duplex auto
 ip dhcp snooping trust
!
interface Ethernet0/2
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet0/3
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet1/0
 description TO_PC1
 switchport access vlan 10
 switchport mode access
 switchport port-security
 duplex auto
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Ethernet1/1
 description TO_PC2
 switchport access vlan 10
 switchport mode access
 switchport port-security
 duplex auto
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Ethernet1/2
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet1/3
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet2/0
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet2/1
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet2/2
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet2/3
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet3/0
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet3/1
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet3/2
 switchport mode access
 shutdown
 duplex auto
!
interface Ethernet3/3
 switchport mode access
 shutdown
 duplex auto
!
interface Vlan1
 no ip address
 no ip route-cache
 shutdown
!
interface Vlan10
 ip address 10.0.10.10 255.255.255.0
 shutdown
!
interface Vlan99
 ip address 10.0.99.10 255.255.255.0
 no ip route-cache
!
ip default-gateway 10.0.10.254
!
no ip http server
!
!
access-list 1 permit 10.0.99.21
access-list 1 permit 10.0.20.21
access-list 1 deny   any
no cdp run
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 access-class 1 in
 exec-timeout 5 0
 login local
 transport input ssh
!
end
