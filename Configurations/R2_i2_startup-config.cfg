!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$OSKv$fksg3FXXGUUP1mE.Q5bE81
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name gns3project.com
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
username isaac secret 5 $1$Qtiq$NPcXI7APHE67kU.mPqpgz0
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 60.60.60.60 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description TO_D2
 ip address 10.10.100.13 255.255.255.252
 ip ospf 1 area 0
 half-duplex
!
interface Ethernet1/0
 description TO_D1
 ip address 10.10.100.9 255.255.255.252
 ip ospf 1 area 0
 half-duplex
!
interface Ethernet1/1
 no ip address
 shutdown
 half-duplex
!
interface Ethernet1/2
 no ip address
 shutdown
 half-duplex
!
interface Ethernet1/3
 no ip address
 shutdown
 half-duplex
!
router ospf 1
 log-adjacency-changes
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet1/0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
access-list 1 permit 10.0.99.21
access-list 1 deny   any
no cdp log mismatch duplex
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 access-class 1 in
 exec-timeout 5 0
 privilege level 15
 login local
 length 0
 transport input ssh
line vty 5 15
 exec-timeout 5 0
 login local
 transport input ssh
