!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SRV1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp relay information check
ip dhcp relay information trust-all
no ip dhcp use vrf connected
ip dhcp excluded-address 10.0.10.252 10.0.10.254
ip dhcp excluded-address 10.0.20.252 10.0.20.254
ip dhcp excluded-address 10.0.30.252 10.0.30.254
ip dhcp excluded-address 10.0.40.252 10.0.40.254
ip dhcp excluded-address 10.0.10.1 10.0.10.20
ip dhcp excluded-address 10.0.20.1 10.0.20.20
ip dhcp excluded-address 10.0.30.1 10.0.30.20
ip dhcp excluded-address 10.0.40.1 10.0.40.20
ip dhcp excluded-address 10.0.20.21

!
ip dhcp pool VLAN10
   network 10.0.10.0 255.255.255.0
   default-router 10.0.10.254 
   dns-server 8.8.8.8 
   lease 0 0 30
!
ip dhcp pool VLAN20
   network 10.0.20.0 255.255.255.0
   default-router 10.0.20.254 
   dns-server 8.8.8.8 
   lease 0 0 30
!
ip dhcp pool VLAN30
   network 10.0.30.0 255.255.255.0
   default-router 10.0.30.254 
   dns-server 8.8.8.8 
   lease 0 0 30
!
ip dhcp pool VLAN40
   network 10.0.40.0 255.255.255.0
   default-router 10.0.40.254 
   dns-server 8.8.8.8 
   domain-name wr
   lease 0 0 30
!
!
ip host PC1 10.0.10.21
ip host D2 80.80.80.80
ip name-server 8.8.8.8
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Ethernet0/0
 ip address 10.0.30.1 255.255.255.0
 half-duplex
!
interface Ethernet1/0
 no ip address
 shutdown
 half-duplex
!
interface Ethernet1/1
 no ip address
 shutdown
 half-duplex
!
interface Ethernet1/2
 no ip address
 shutdown
 half-duplex
!
interface Ethernet1/3
 no ip address
 shutdown
 half-duplex
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 network 10.0.30.0 0.0.0.255 area 10
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 10.0.30.254
ip route 0.0.0.0 0.0.0.0 10.3.30.254
!
!
no ip http server
no ip http secure-server
ip dns server
!
no cdp log mismatch duplex
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
